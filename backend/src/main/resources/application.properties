# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=meshable-ops-backend

# ─── PostgreSQL / JPA ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:app_db}${POSTGRES_JDBC_PARAMETERS:}
spring.datasource.username=${POSTGRES_USER:app_user}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
# schema.sql contains supplemental objects; let Hibernate create JPA tables first.
spring.jpa.defer-datasource-initialization=true
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:250MB}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP is Spring Boot's default JDBC pool. Values are environment-tunable.
spring.datasource.hikari.pool-name=MeshableOpsPostgresPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# ─── Vector search (pgvector) ────────────────────────────────────────────────
# The schema uses 1536 dimensions; EmbeddingDimensions is the backend source of truth.
ml.base-url=${ML_BASE_URL:http://ml-backend:8000}

# Stored provider credentials use authenticated encryption, with wrapping keys outside the database.
app.secrets.encryption-key=${APP_SECRETS_ENCRYPTION_KEY:}
app.secrets.previous-encryption-key=${APP_SECRETS_PREVIOUS_ENCRYPTION_KEY:}
app.auth-cookie-secure=${APP_AUTH_COOKIE_SECURE:true}

# Optional host-managed OpenID Connect login providers (disabled by default).
app.auth.external.entra.enabled=${APP_AUTH_ENTRA_ENABLED:false}
app.auth.external.entra.tenant-id=${APP_AUTH_ENTRA_TENANT_ID:}
app.auth.external.entra.client-id=${APP_AUTH_ENTRA_CLIENT_ID:}
app.auth.external.entra.client-secret=${APP_AUTH_ENTRA_CLIENT_SECRET:}
app.auth.external.google.enabled=${APP_AUTH_GOOGLE_ENABLED:false}
app.auth.external.google.client-id=${APP_AUTH_GOOGLE_CLIENT_ID:}
app.auth.external.google.client-secret=${APP_AUTH_GOOGLE_CLIENT_SECRET:}
# Only the short-lived OIDC handshake uses an HTTP session. App authentication stays stateless.
server.servlet.session.timeout=10m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=app_oidc_flow
server.servlet.session.cookie.path=/api/auth/oidc
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_AUTH_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# Admin configuration is independent of environment configuration; credentials never cross between them.
app.ai.enabled=${AI_ENABLED:false}
app.ai.search-enabled=${APP_SEARCH_ENABLED:true}
app.ai.launcher-enabled=${APP_SEARCH_LAUNCHER_ENABLED:true}
app.ai.index-content=${AI_INDEX_CONTENT:false}
app.ai.chat.provider=${AI_CHAT_PROVIDER:OPENAI_COMPATIBLE}
app.ai.chat.base-url=${AI_CHAT_BASE_URL:https://api.openai.com/v1}
app.ai.chat.model=${AI_CHAT_MODEL:}
app.ai.chat.api-key=${AI_CHAT_API_KEY:}
app.ai.embeddings.provider=${AI_EMBEDDING_PROVIDER:LOCAL}
app.ai.embeddings.base-url=${AI_EMBEDDING_BASE_URL:}
app.ai.embeddings.model=${AI_EMBEDDING_MODEL:local-feature-hash-v3}
app.ai.embeddings.api-key=${AI_EMBEDDING_API_KEY:}
app.ai.embeddings.send-dimensions=${AI_EMBEDDING_SEND_DIMENSIONS:true}

# ─── Optional outbound email ──────────────────────────────────────────────────
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.provider=${APP_EMAIL_PROVIDER:SMTP}
app.email.from-address=${APP_EMAIL_FROM_ADDRESS:}
app.email.from-name=${APP_EMAIL_FROM_NAME:}
app.email.reply-to=${APP_EMAIL_REPLY_TO:}
app.email.smtp-host=${APP_EMAIL_SMTP_HOST:}
app.email.smtp-port=${APP_EMAIL_SMTP_PORT:587}
app.email.smtp-security=${APP_EMAIL_SMTP_SECURITY:STARTTLS}
app.email.smtp-auth=${APP_EMAIL_SMTP_AUTH:PASSWORD}
app.email.smtp-username=${APP_EMAIL_SMTP_USERNAME:}
app.email.smtp-password=${APP_EMAIL_SMTP_PASSWORD:}
app.email.api-base-url=${APP_EMAIL_API_BASE_URL:}
app.email.api-key=${APP_EMAIL_API_KEY:}
app.email.mailgun-domain=${APP_EMAIL_MAILGUN_DOMAIN:}

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.mfa.primary-admin-email=${APP_MFA_PRIMARY_ADMIN_EMAIL:}
app.public-base-url=${APP_PUBLIC_BASE_URL:}
app.webhooks.allow-private-targets=${APP_WEBHOOK_ALLOW_PRIVATE_TARGETS:false}
app.plugins.allow-private-targets=${APP_PLUGIN_ALLOW_PRIVATE_TARGETS:false}
app.plugins.runner-url=${APP_PLUGIN_RUNNER_URL:http://plugin-runner:8090}
app.plugins.runner-token=${APP_PLUGIN_RUNNER_TOKEN:}
app.documents.renderer-url=${APP_DOCUMENT_RENDER_URL:http://weasy-renderer:8000}
app.documents.renderer-token=${APP_DOCUMENT_RENDER_TOKEN:}
jwt.secret=${JWT_SECRET}
jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# Explicit initial accounts only; no development users or sample dashboards.
app.bootstrap-users-json=${APP_BOOTSTRAP_USERS_JSON:}

# Seed object storage (preserve the deployment environment variable names).
app.seed-storage.provider=${APP_SEED_STORAGE_PROVIDER:NONE}
app.seed-storage.bucket=${APP_SEED_STORAGE_BUCKET:}
app.seed-storage.region=${APP_SEED_STORAGE_REGION:us-east-1}
app.seed-storage.endpoint=${APP_SEED_STORAGE_ENDPOINT:}
app.seed-storage.access-key=${APP_SEED_STORAGE_ACCESS_KEY:}
app.seed-storage.secret-key=${APP_SEED_STORAGE_SECRET_KEY:}
app.seed-storage.root-path=${APP_SEED_STORAGE_ROOT_PATH:folders}
app.seed-storage.force=${APP_SEED_STORAGE_FORCE:false}

# ─── Superset ────────────────────────────────────────────────────────────────
superset.base-url=${SUPERSET_BASE_URL:http://superset:8088}
superset.admin-user=${SUPERSET_ADMIN_USER:admin}
superset.admin-password=${SUPERSET_ADMIN_PASSWORD}

# ─── CORS ────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://[::1]:3000,http://localhost:5173,http://127.0.0.1:5173,http://[::1]:5173,http://frontend:80

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,info,metrics

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.starter=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
