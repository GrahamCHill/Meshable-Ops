# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=starter-backend

# ─── PostgreSQL / JPA ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:app_db}
spring.datasource.username=${POSTGRES_USER:app_user}
spring.datasource.password=${POSTGRES_PASSWORD:app_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
# schema.sql contains supplemental objects; let Hibernate create JPA tables first.
spring.jpa.defer-datasource-initialization=true
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:250MB}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP is Spring Boot's default JDBC pool. Values are environment-tunable.
spring.datasource.hikari.pool-name=StarterPostgresPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# ─── MongoDB ─────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGO_URI:mongodb://app_user:app_pass@localhost:27017/app_db?authSource=admin}
spring.data.mongodb.auto-index-creation=false

# ─── Vector search (pgvector) ────────────────────────────────────────────────
vector.dimensions=384
ml.base-url=${ML_BASE_URL:http://ml-backend:8000}

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dev-secret-change-in-production-min-256-bits}
jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# Seed admin
app.seed-admin.email=${APP_SEED_ADMIN_EMAIL:admin@app.local}
app.seed-admin.username=${APP_SEED_ADMIN_USERNAME:admin}
app.seed-admin.password=${APP_SEED_ADMIN_PASSWORD:admin123}
app.seed-admin.role=${APP_SEED_ADMIN_ROLE:ADMIN}
app.seed-user.email=${APP_SEED_USER_EMAIL:user@app.local}
app.seed-user.username=${APP_SEED_USER_USERNAME:user}
app.seed-user.password=${APP_SEED_USER_PASSWORD:user123}
app.seed-user.role=${APP_SEED_USER_ROLE:USER}
app.bootstrap-users-json=${APP_BOOTSTRAP_USERS_JSON:}
app.seed-dashboard.label=${APP_SEED_DASHBOARD_LABEL:Metrics Overview}
app.seed-dashboard.description=${APP_SEED_DASHBOARD_DESCRIPTION:Items created over time}
app.seed-dashboard.id=${APP_SEED_DASHBOARD_ID:fdda8aae-c6fb-48fc-9322-5f797764b9dd}
app.seed-dashboard.guest-token-resource-id=${APP_SEED_DASHBOARD_GUEST_TOKEN_RESOURCE_ID:}
app.seed-dashboard.allowed-roles=${APP_SEED_DASHBOARD_ALLOWED_ROLES:ADMIN,USER}

# Seed object storage (preserve the deployment environment variable names).
app.seed-storage.provider=${APP_SEED_STORAGE_PROVIDER:NONE}
app.seed-storage.bucket=${APP_SEED_STORAGE_BUCKET:}
app.seed-storage.region=${APP_SEED_STORAGE_REGION:us-east-1}
app.seed-storage.endpoint=${APP_SEED_STORAGE_ENDPOINT:}
app.seed-storage.access-key=${APP_SEED_STORAGE_ACCESS_KEY:}
app.seed-storage.secret-key=${APP_SEED_STORAGE_SECRET_KEY:}
app.seed-storage.root-path=${APP_SEED_STORAGE_ROOT_PATH:folders}
app.seed-storage.force=${APP_SEED_STORAGE_FORCE:false}

# ─── Superset ────────────────────────────────────────────────────────────────
superset.base-url=${SUPERSET_BASE_URL:http://superset:8088}
superset.admin-user=${SUPERSET_ADMIN_USER:admin}
superset.admin-password=${SUPERSET_ADMIN_PASSWORD:admin}

# ─── CORS ────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://[::1]:3000,http://localhost:5173,http://127.0.0.1:5173,http://[::1]:5173,http://frontend:80

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,info,metrics

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.starter=DEBUG
logging.level.org.springframework.security=WARN
