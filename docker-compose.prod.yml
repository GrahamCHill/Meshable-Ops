services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set these in `.env.production`.
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    ports: []

  mongodb:
    ports: []

  redis:
    ports: []

  backend:
    ports: []
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:-86400000}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      APP_BOOTSTRAP_USERS_JSON: ${APP_BOOTSTRAP_USERS_JSON}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}

  superset-init:
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}

  superset:
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}

  superset-embed-init:
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}

  superset-worker:
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}

  superset-beat:
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}

  frontend:
    expose:
      - "8080"

volumes:
  caddy_data:
  caddy_config:
