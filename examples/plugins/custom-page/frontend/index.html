<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Custom page example</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1 id="heading">Custom page</h1><p>This frontend and its Python handler are loaded from the installed ZIP.</p>
<form id="greeting-form"><label for="name">Your name</label><input id="name" name="name" required maxlength="100" autocomplete="given-name"><button id="send" type="submit">Call backend</button></form>

</main><script src="app.js"></script></body></html>
