x-superset-env: &superset-env
  DATABASE_DB: superset
  DATABASE_HOST: postgres
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Generate private environment settings first}
  DATABASE_USER: superset_user
  DATABASE_PORT: "5432"
  DATABASE_DIALECT: postgresql
  POSTGRES_DB: superset
  POSTGRES_USER: superset_user
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate private environment settings first}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SUPERSET_ENV: production
  SUPERSET_LOAD_EXAMPLES: "no"
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY}
  SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD}
  SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@superset.local}
  SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Admin}
  SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-User}
  PYTHONPATH: /app/pythonpath
  CYPRESS_CONFIG: "false"
  FLASK_ENV: production
  SUPERSET_PORT: "8088"
  ENABLE_PROXY_FIX: "true"
  GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET:?Set GUEST_TOKEN_JWT_SECRET}
  GUEST_TOKEN_JWT_ALGO: "HS256"
  GUEST_TOKEN_JWT_HEADER_NAME: "X-GuestToken"
  GUEST_TOKEN_JWT_EXP_SECONDS: "300"

services:

  # ─── Databases ─────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: superset
      PGDATA: /var/lib/postgresql/18/docker
    expose:
      - "5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset_user -d superset"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: app_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: app_db
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Apache Superset ───────────────────────────────────────────────────────

  superset-init:
    image: apache/superset:4.0.2
    command: ["/app/docker/docker-init.sh"]
    environment:
      <<: *superset-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./superset/docker-init.sh:/app/docker/docker-init.sh:ro
      - ./superset/bootstrap_admin.py:/app/bootstrap_admin.py:ro
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    restart: "no"

  superset:
    image: apache/superset:4.0.2
    command: ["/usr/bin/run-server.sh"]
    restart: unless-stopped
    environment:
      <<: *superset-env
    depends_on:
      superset-init:
        condition: service_completed_successfully
    expose:
      - "8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - superset_home:/app/superset_home
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  superset-worker:
    image: apache/superset:4.0.2
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker",
              "--pool=prefork", "--max-tasks-per-child=128"]
    restart: unless-stopped
    environment:
      <<: *superset-env
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    healthcheck:
      test: ["CMD-SHELL", "celery --app=superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  superset-beat:
    image: apache/superset:4.0.2
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat",
              "--pidfile=/tmp/celerybeat.pid", "--schedule=/tmp/celerybeat-schedule"]
    restart: unless-stopped
    environment:
      <<: *superset-env
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    # beat has no HTTP endpoint to ping; disable healthcheck to avoid false unhealthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Kotlin Backend ────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: app_db
      POSTGRES_USER: superset_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MONGO_URI: mongodb://app_user:${MONGO_PASSWORD:?Set MONGO_PASSWORD}@mongodb:27017/app_db?authSource=admin
      DB_POOL_MAX_SIZE: 10
      DB_POOL_MIN_IDLE: 2
      APP_SEED_STORAGE_PROVIDER: ${APP_SEED_STORAGE_PROVIDER:-NONE}
      APP_SEED_STORAGE_BUCKET: ${APP_SEED_STORAGE_BUCKET:-}
      APP_SEED_STORAGE_REGION: ${APP_SEED_STORAGE_REGION:-}
      APP_SEED_STORAGE_ENDPOINT: ${APP_SEED_STORAGE_ENDPOINT:-}
      APP_SEED_STORAGE_ACCESS_KEY: ${APP_SEED_STORAGE_ACCESS_KEY:-}
      APP_SEED_STORAGE_SECRET_KEY: ${APP_SEED_STORAGE_SECRET_KEY:-}
      APP_SEED_STORAGE_ROOT_PATH: ${APP_SEED_STORAGE_ROOT_PATH:-folders}
      APP_SEED_STORAGE_FORCE: ${APP_SEED_STORAGE_FORCE:-false}
      ML_BASE_URL: http://ml-backend:8000
      APP_SECRETS_ENCRYPTION_KEY: ${APP_SECRETS_ENCRYPTION_KEY:-}
      APP_SECRETS_PREVIOUS_ENCRYPTION_KEY: ${APP_SECRETS_PREVIOUS_ENCRYPTION_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-false}
      APP_EMAIL_PROVIDER: ${APP_EMAIL_PROVIDER:-SMTP}
      APP_EMAIL_FROM_ADDRESS: ${APP_EMAIL_FROM_ADDRESS:-}
      APP_EMAIL_FROM_NAME: ${APP_EMAIL_FROM_NAME:-}
      APP_EMAIL_REPLY_TO: ${APP_EMAIL_REPLY_TO:-}
      APP_EMAIL_SMTP_HOST: ${APP_EMAIL_SMTP_HOST:-}
      APP_EMAIL_SMTP_PORT: ${APP_EMAIL_SMTP_PORT:-587}
      APP_EMAIL_SMTP_SECURITY: ${APP_EMAIL_SMTP_SECURITY:-STARTTLS}
      APP_EMAIL_SMTP_AUTH: ${APP_EMAIL_SMTP_AUTH:-PASSWORD}
      APP_EMAIL_SMTP_USERNAME: ${APP_EMAIL_SMTP_USERNAME:-}
      APP_EMAIL_SMTP_PASSWORD: ${APP_EMAIL_SMTP_PASSWORD:-}
      APP_EMAIL_API_BASE_URL: ${APP_EMAIL_API_BASE_URL:-}
      APP_EMAIL_API_KEY: ${APP_EMAIL_API_KEY:-}
      APP_EMAIL_MAILGUN_DOMAIN: ${APP_EMAIL_MAILGUN_DOMAIN:-}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      APP_AUTH_ENTRA_ENABLED: ${APP_AUTH_ENTRA_ENABLED:-false}
      APP_AUTH_ENTRA_TENANT_ID: ${APP_AUTH_ENTRA_TENANT_ID:-}
      APP_AUTH_ENTRA_CLIENT_ID: ${APP_AUTH_ENTRA_CLIENT_ID:-}
      APP_AUTH_ENTRA_CLIENT_SECRET: ${APP_AUTH_ENTRA_CLIENT_SECRET:-}
      APP_AUTH_GOOGLE_ENABLED: ${APP_AUTH_GOOGLE_ENABLED:-false}
      APP_AUTH_GOOGLE_CLIENT_ID: ${APP_AUTH_GOOGLE_CLIENT_ID:-}
      APP_AUTH_GOOGLE_CLIENT_SECRET: ${APP_AUTH_GOOGLE_CLIENT_SECRET:-}
      APP_MFA_PRIMARY_ADMIN_EMAIL: ${APP_MFA_PRIMARY_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_USERS_JSON: ${APP_BOOTSTRAP_USERS_JSON:-}
      APP_WEBHOOK_ALLOW_PRIVATE_TARGETS: ${APP_WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
      APP_PLUGIN_ALLOW_PRIVATE_TARGETS: ${APP_PLUGIN_ALLOW_PRIVATE_TARGETS:-false}
      APP_PLUGIN_RUNNER_URL: ${APP_PLUGIN_RUNNER_URL:-http://plugin-runner:8090}
      APP_PLUGIN_RUNNER_TOKEN: ${APP_PLUGIN_RUNNER_TOKEN:-}
      APP_DOCUMENT_RENDER_URL: ${APP_DOCUMENT_RENDER_URL:-http://weasy-renderer:8000}
      APP_DOCUMENT_RENDER_TOKEN: ${APP_DOCUMENT_RENDER_TOKEN:-}
      APP_SEARCH_ENABLED: ${APP_SEARCH_ENABLED:-true}
      APP_SEARCH_LAUNCHER_ENABLED: ${APP_SEARCH_LAUNCHER_ENABLED:-true}
      AI_INDEX_CONTENT: ${AI_INDEX_CONTENT:-false}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-OPENAI_COMPATIBLE}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-LOCAL}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-local-feature-hash-v3}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_SEND_DIMENSIONS: ${AI_EMBEDDING_SEND_DIMENSIONS:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:-86400000}
      SUPERSET_BASE_URL: http://superset:8088
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  plugin-python-worker:
    image: meshable-ops-plugin-python:1
    build:
      context: ./plugin-runtime
      dockerfile: workers/python.Dockerfile
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  plugin-kotlin-worker:
    image: meshable-ops-plugin-kotlin:1
    build:
      context: ./plugin-runtime
      dockerfile: workers/kotlin.Dockerfile
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  plugin-runner:
    build: ./plugin-runtime
    restart: unless-stopped
    group_add: ["${DOCKER_GID:-0}"]
    depends_on:
      plugin-python-worker:
        condition: service_completed_successfully
      plugin-kotlin-worker:
        condition: service_completed_successfully
    environment:
      APP_PLUGIN_RUNNER_TOKEN: ${APP_PLUGIN_RUNNER_TOKEN:-}
      PLUGIN_HOST_CALLBACK: http://backend:8080/internal/plugins/host-call
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose: ["8090"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=32m"]
    mem_limit: 1g
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  weasy-renderer:
    build: ./weasy-renderer
    restart: unless-stopped
    environment:
      APP_DOCUMENT_RENDER_TOKEN: ${APP_DOCUMENT_RENDER_TOKEN:-}
    expose:
      - "8000"
    mem_limit: 1536m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ml-backend:
    build:
      context: ./ml-backend
      dockerfile: Dockerfile
      args:
        EXTRA_PIP_PACKAGES: ${ML_EXTRA_PIP_PACKAGES:-}
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── React Frontend ────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ml-backend:
        condition: service_healthy
      superset:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres_data:
  postgres18_data:
  mongo_data:
  redis_data:
  superset_home:
