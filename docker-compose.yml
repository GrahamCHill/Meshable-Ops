x-superset-env: &superset-env
  DATABASE_DB: superset
  DATABASE_HOST: postgres
  DATABASE_PASSWORD: superset_pass
  DATABASE_USER: superset_user
  DATABASE_PORT: "5432"
  DATABASE_DIALECT: postgresql
  POSTGRES_DB: superset
  POSTGRES_USER: superset_user
  POSTGRES_PASSWORD: superset_pass
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SUPERSET_ENV: production
  SUPERSET_LOAD_EXAMPLES: "no"
  SUPERSET_SECRET_KEY: "thisISaSECRET_1234_change_in_prod"
  PYTHONPATH: /app/pythonpath
  CYPRESS_CONFIG: "false"
  FLASK_ENV: production
  SUPERSET_PORT: "8088"
  ENABLE_PROXY_FIX: "true"
  GUEST_TOKEN_JWT_SECRET: "guest_token_secret_change_in_prod"
  GUEST_TOKEN_JWT_ALGO: "HS256"
  GUEST_TOKEN_JWT_HEADER_NAME: "X-GuestToken"
  GUEST_TOKEN_JWT_EXP_SECONDS: "300"

services:

  # ─── Databases ─────────────────────────────────────────────────────────────

  postgres:
    image: postgres:18-alpine
    container_name: superset_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset_user
      POSTGRES_PASSWORD: superset_pass
      POSTGRES_DB: superset
      PGDATA: /var/lib/postgresql/18/docker
    expose:
      - "5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset_user -d superset"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: superset_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: app_user
      MONGO_INITDB_ROOT_PASSWORD: app_pass
      MONGO_INITDB_DATABASE: app_db
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: superset_qdrant
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: superset_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Apache Superset ───────────────────────────────────────────────────────

  superset-init:
    image: apache/superset:4.0.2
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    environment:
      <<: *superset-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./superset/docker-init.sh:/app/docker/docker-init.sh
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    restart: "no"

  superset:
    image: apache/superset:4.0.2
    container_name: superset_app
    command: ["/usr/bin/run-server.sh"]
    restart: unless-stopped
    environment:
      <<: *superset-env
    depends_on:
      superset-init:
        condition: service_completed_successfully
    expose:
      - "8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - superset_home:/app/superset_home
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  superset-embed-init:
    image: apache/superset:4.0.2
    container_name: superset_embed_init
    command: ["python", "/app/setup_embed_dashboard.py"]
    restart: "no"
    environment:
      <<: *superset-env
      APP_POSTGRES_DB: app_db
      APP_POSTGRES_USER: superset_user
      APP_POSTGRES_PASSWORD: superset_pass
    depends_on:
      superset:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./superset/setup_embed_dashboard.py:/app/setup_embed_dashboard.py

  superset-worker:
    image: apache/superset:4.0.2
    container_name: superset_worker
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker",
              "--pool=prefork", "--max-tasks-per-child=128"]
    restart: unless-stopped
    environment:
      <<: *superset-env
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    healthcheck:
      test: ["CMD-SHELL", "celery --app=superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  superset-beat:
    image: apache/superset:4.0.2
    container_name: superset_beat
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat",
              "--pidfile=/tmp/celerybeat.pid", "--schedule=/tmp/celerybeat-schedule"]
    restart: unless-stopped
    environment:
      <<: *superset-env
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    # beat has no HTTP endpoint to ping; disable healthcheck to avoid false unhealthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Kotlin Backend ────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superset_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: app_db
      POSTGRES_USER: superset_user
      POSTGRES_PASSWORD: superset_pass
      MONGO_URI: mongodb://app_user:app_pass@mongodb:27017/app_db?authSource=admin
      QDRANT_BASE_URL: http://qdrant:6333
      ML_BASE_URL: http://ml-backend:8000
      JWT_SECRET: change-me-in-production-use-a-256-bit-key
      JWT_EXPIRY_MS: 86400000
      SUPERSET_BASE_URL: http://superset:8088
      SUPERSET_ADMIN_USER: admin
      SUPERSET_ADMIN_PASSWORD: admin
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  ml-backend:
    build:
      context: ./ml-backend
      dockerfile: Dockerfile
      args:
        EXTRA_PIP_PACKAGES: ${ML_EXTRA_PIP_PACKAGES:-}
    container_name: superset_ml_backend
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── React Frontend ────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: superset_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ml-backend:
        condition: service_healthy
      superset:
        condition: service_healthy
      superset-embed-init:
        condition: service_completed_successfully
    ports:
      - "3000:80"

volumes:
  postgres_data:
  postgres18_data:
  mongo_data:
  qdrant_data:
  redis_data:
  superset_home:
