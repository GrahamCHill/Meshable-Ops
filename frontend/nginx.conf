server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    include /etc/nginx/snippets/workspace-headers.conf;
    client_max_body_size 250m;

    # Preserve Superset's native root and /superset/* routes. /superset is a
    # native route namespace, not a deployment prefix to strip from every URL.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_redirect off;

    location = /_auth/superset-admin {
        internal;
        proxy_pass http://backend:8080/api/auth/superset-admin-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }
    location = /robots.txt { default_type text/plain; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://backend:8080;
    }
    # App login is /login; Superset's form is /login/.
    location = /login { try_files /index.html =404; }
    location = /login/ {
        auth_request /_auth/superset-admin;
        proxy_pass http://superset:8088;
    }
    location ~ ^/superset/login/?$ { return 302 /login/$is_args$args; }
    location ~ ^/(?:superset/)?(?:dashboardmodelview|dashboard)/list/?$ {
        auth_request /_auth/superset-admin;
        rewrite ^ /dashboard/list/ break;
        proxy_pass http://superset:8088;
    }
    location ~ ^/(?:superset/)?(?:chartmodelview|chart)/list/?$ {
        auth_request /_auth/superset-admin;
        rewrite ^ /chart/list/ break;
        proxy_pass http://superset:8088;
    }
    location ~ ^/(superset|dashboard|dashboardasync|chart|databaseview|tablemodelview|savedqueryview|savedqueryviewapi|sqllab|explore|users|roles|permissionviews|logmodelview|annotationlayermodelview|csstemplateasyncmodelview|rowlevelsecurityfiltersmodelview|csvtodatabaseview|tablestatsview|queryview|tagmodelview|report|datasetmodelview|tablecolumninlineview|tabstateview|tableschemaview|lang|logout)(/|$) {
        auth_request /_auth/superset-admin;
        proxy_pass http://superset:8088;
    }
    location = /log/ {
        auth_request /_auth/superset-admin;
        proxy_pass http://superset:8088/superset/log/;
    }
    # Collection aliases used by older Superset frontend bundles.
    location ~ ^/api/v1/(dashboard|chart)/list/?$ {
        auth_request /_auth/superset-admin;
        rewrite ^/api/v1/(dashboard|chart)/list/?$ /api/v1/$1/ break;
        proxy_pass http://superset:8088;
    }
    location ~ ^/api/v1/dashboard/list/(charts|datasets)/?$ {
        auth_request /_auth/superset-admin;
        rewrite ^/api/v1/dashboard/list/charts/?$ /api/v1/chart/ break;
        rewrite ^/api/v1/dashboard/list/datasets/?$ /api/v1/dataset/ break;
        proxy_pass http://superset:8088;
    }
    # Authoring APIs need app-admin authorization as well as a Superset session.
    # Guest requests use a separate branch with no ambient authoring credentials.
    location /api/v1/ {
        error_page 418 = @superset_guest_api;
        if ($http_x_guesttoken != "") { return 418; }
        auth_request /_auth/superset-admin;
        proxy_pass http://superset:8088;
    }
    location @superset_guest_api {
        proxy_pass http://superset:8088;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location ^~ /embedded/ {
        proxy_pass http://superset:8088;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer $scheme://$http_host/dashboards;
        proxy_set_header Origin $scheme://$http_host;
    }
    location ^~ /static/ { proxy_pass http://superset:8088; }
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|svg|woff2?)$ {
        include /etc/nginx/snippets/workspace-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
