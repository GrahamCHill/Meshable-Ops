server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    add_header Referrer-Policy "same-origin" always;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api → backend (used only when running standalone without Compose's DNS)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Superset emits a mix of /superset/* and root-level app-builder URLs.
    # These root-level routes are kept scoped to known Superset screens so they
    # don't swallow the main app's own SPA routes.
    location ~ ^/(dashboard|chart|databaseview|tablemodelview|savedqueryview|savedqueryviewapi|sqllab|explore|users|roles|permissionviews|logmodelview|annotationlayermodelview|csstemplateasyncmodelview|rowlevelsecurityfiltersmodelview|csvtodatabaseview|tablestatsview|queryview|tagmodelview|report|datasetmodelview|tablecolumninlineview|tabstateview|tableschemaview|lang)/ {
        proxy_pass http://superset:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /logout/ {
        proxy_pass http://superset:8088/logout/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /log/ {
        proxy_pass http://superset:8088/log/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    # Embedded dashboard SDK loads the iframe at /embedded/<uuid>. This must be
    # served at root (not under /superset/) because Superset's embedded SPA
    # uses client-side routing that matches against /embedded/:uuid/ exactly.
    location ^~ /embedded/ {
        proxy_pass http://superset:8088/embedded/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Some Firefox-family browsers omit Referer on iframe bootstrap. Superset's
        # embedded view uses the origin/referrer allowlist, so provide a stable
        # same-origin referer for embedded dashboard loads through this app.
        proxy_set_header Referer $scheme://$http_host/dashboards;
        proxy_set_header Origin $scheme://$http_host;
        proxy_redirect off;
    }

    # Superset UI assets resolve from /static/* even when the page is under /superset/*
    location ^~ /static/ {
        proxy_pass http://superset:8088/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Superset frontend issues API calls to /api/v1/*
    location ^~ /api/v1/ {
        proxy_pass http://superset:8088/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Superset's login endpoint lives at /login/, but after auth the app routes
    # live under /superset/* when proxy-prefix headers are applied.
    location = /superset/login {
        proxy_pass http://superset:8088/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /superset/login/ {
        proxy_pass http://superset:8088/login/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /superset {
        return 302 /superset/welcome/;
    }

    location = /superset/ {
        return 302 /superset/welcome/;
    }

    location = /superset/welcome {
        proxy_pass http://superset:8088/superset/welcome;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /superset/welcome/ {
        proxy_pass http://superset:8088/superset/welcome/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location ^~ /superset/ {
        proxy_pass http://superset:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
