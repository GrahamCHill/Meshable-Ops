server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    add_header Referrer-Policy "same-origin" always;

    location = /_auth/superset-admin {
        internal;
        proxy_pass http://backend:8080/api/auth/superset-admin-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api → backend (used only when running standalone without Compose's DNS)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Superset emits a mix of /superset/* and root-level app-builder URLs.
    # These root-level routes are kept scoped to known Superset screens so they
    # don't swallow the main app's own SPA routes.
    location ~ ^/(dashboard|dashboardmodelview|chart|databaseview|tablemodelview|savedqueryview|savedqueryviewapi|sqllab|explore|users|roles|permissionviews|logmodelview|annotationlayermodelview|csstemplateasyncmodelview|rowlevelsecurityfiltersmodelview|csvtodatabaseview|tablestatsview|queryview|tagmodelview|report|datasetmodelview|tablecolumninlineview|tabstateview|tableschemaview|lang)/ {
        auth_request /_auth/superset-admin;
        if ($http_sec_fetch_dest = "document") {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        proxy_pass http://superset:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /logout/ {
        auth_request /_auth/superset-admin;
        if ($http_sec_fetch_dest = "document") {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        proxy_pass http://superset:8088/logout/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /log/ {
        auth_request /_auth/superset-admin;
        if ($http_sec_fetch_dest = "document") {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        proxy_pass http://superset:8088/superset/log/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    # Canonicalize dashboard list links into the proxied /superset namespace.
    location = /dashboard/list {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/dashboard/list/;
    }

    location = /dashboard/list/ {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/dashboard/list/;
    }

    location = /superset/dashboard/list {
        auth_request /_auth/superset-admin;
        proxy_pass http://superset:8088/dashboard/list;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /superset/dashboard/list/ {
        auth_request /_auth/superset-admin;
        proxy_pass http://superset:8088/dashboard/list/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    # Canonicalize chart list links into the proxied /superset namespace.
    location = /chart/list {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/chart/list/;
    }

    location = /chart/list/ {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/chart/list/;
    }

    location = /superset/chart/list {
        auth_request /_auth/superset-admin;
        proxy_pass http://superset:8088/chart/list;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /superset/chart/list/ {
        auth_request /_auth/superset-admin;
        proxy_pass http://superset:8088/chart/list/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /chartmodelview/list {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/chart/list/;
    }

    location = /chartmodelview/list/ {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/chart/list/;
    }

    location = /superset/chartmodelview/list {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/chart/list/;
    }

    location = /superset/chartmodelview/list/ {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/chart/list/;
    }

    location = /dashboardmodelview/list {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/dashboard/list/;
    }

    location = /dashboardmodelview/list/ {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/dashboard/list/;
    }

    location = /superset/dashboardmodelview/list {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/dashboard/list/;
    }

    location = /superset/dashboardmodelview/list/ {
        auth_request /_auth/superset-admin;
        return 302 $scheme://$http_host/superset/dashboard/list/;
    }

    # Superset list pages in 4.0.2 still call legacy REST paths ending in /list.
    # Rewrite those to the current collection endpoints so dashboard/chart lists load.
    location = /api/v1/dashboard/list {
        proxy_pass http://superset:8088/api/v1/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /api/v1/dashboard/list/ {
        proxy_pass http://superset:8088/api/v1/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /api/v1/chart/list {
        proxy_pass http://superset:8088/api/v1/chart/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /api/v1/chart/list/ {
        proxy_pass http://superset:8088/api/v1/chart/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    # Some Superset 4.0.2 list views still construct related fetches relative
    # to the legacy dashboard list endpoint, which yields invalid URLs such as
    # /api/v1/dashboard/list/charts and /api/v1/dashboard/list/datasets.
    # Canonicalize them to the current collection APIs so the embedded admin
    # workspace can complete loading after login and while navigating list pages.
    location = /api/v1/dashboard/list/charts {
        proxy_pass http://superset:8088/api/v1/chart/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /api/v1/dashboard/list/charts/ {
        proxy_pass http://superset:8088/api/v1/chart/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /api/v1/dashboard/list/datasets {
        proxy_pass http://superset:8088/api/v1/dataset/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /api/v1/dashboard/list/datasets/ {
        proxy_pass http://superset:8088/api/v1/dataset/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /superset/log/ {
        auth_request /_auth/superset-admin;
        if ($http_sec_fetch_dest = "document") {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        proxy_pass http://superset:8088/superset/log/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    # Embedded dashboard SDK loads the iframe at /embedded/<uuid>. This must be
    # served at root (not under /superset/) because Superset's embedded SPA
    # uses client-side routing that matches against /embedded/:uuid/ exactly.
    location ^~ /embedded/ {
        proxy_pass http://superset:8088/embedded/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Some Firefox-family browsers omit Referer on iframe bootstrap. Superset's
        # embedded view uses the origin/referrer allowlist, so provide a stable
        # same-origin referer for embedded dashboard loads through this app.
        proxy_set_header Referer $scheme://$http_host/dashboards;
        proxy_set_header Origin $scheme://$http_host;
        proxy_redirect off;
    }

    # Superset UI assets resolve from /static/* even when the page is under /superset/*
    location ^~ /static/ {
        proxy_pass http://superset:8088/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Superset frontend issues API calls to /api/v1/*
    location ^~ /api/v1/ {
        proxy_pass http://superset:8088/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Superset's login endpoint lives at /login/, but after auth the app routes
    # live under /superset/* when proxy-prefix headers are applied.
    location = /superset/login {
        set $should_redirect_admin 0;
        if ($http_sec_fetch_dest = "document") {
            set $should_redirect_admin 1;
        }
        if ($http_referer ~* "/superset/|/admin/superset-graph-builder") {
            set $should_redirect_admin 0;
        }
        if ($should_redirect_admin = 1) {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        proxy_pass http://superset:8088/login;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect ~^http://[^/]+(/(?!superset/).*)$ $scheme://$http_host/superset$1;
        proxy_redirect ~^(/(?!superset/).*)$ /superset$1;
    }

    location = /superset/login/ {
        set $should_redirect_admin 0;
        if ($http_sec_fetch_dest = "document") {
            set $should_redirect_admin 1;
        }
        if ($http_referer ~* "/superset/|/admin/superset-graph-builder") {
            set $should_redirect_admin 0;
        }
        if ($should_redirect_admin = 1) {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        proxy_pass http://superset:8088/login/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect ~^http://[^/]+(/(?!superset/).*)$ $scheme://$http_host/superset$1;
        proxy_redirect ~^(/(?!superset/).*)$ /superset$1;
    }

    location = /superset {
        auth_request /_auth/superset-admin;
        set $should_redirect_admin 0;
        if ($http_sec_fetch_dest = "document") {
            set $should_redirect_admin 1;
        }
        if ($http_referer ~* "/superset/|/admin/superset-graph-builder") {
            set $should_redirect_admin 0;
        }
        if ($should_redirect_admin = 1) {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        return 302 $scheme://$http_host/superset/welcome/;
    }

    location = /superset/ {
        auth_request /_auth/superset-admin;
        set $should_redirect_admin 0;
        if ($http_sec_fetch_dest = "document") {
            set $should_redirect_admin 1;
        }
        if ($http_referer ~* "/superset/|/admin/superset-graph-builder") {
            set $should_redirect_admin 0;
        }
        if ($should_redirect_admin = 1) {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        return 302 $scheme://$http_host/superset/welcome/;
    }

    location = /superset/welcome {
        auth_request /_auth/superset-admin;
        set $should_redirect_admin 0;
        if ($http_sec_fetch_dest = "document") {
            set $should_redirect_admin 1;
        }
        if ($http_referer ~* "/superset/|/admin/superset-graph-builder") {
            set $should_redirect_admin 0;
        }
        if ($should_redirect_admin = 1) {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        proxy_pass http://superset:8088/superset/welcome;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location = /superset/welcome/ {
        auth_request /_auth/superset-admin;
        set $should_redirect_admin 0;
        if ($http_sec_fetch_dest = "document") {
            set $should_redirect_admin 1;
        }
        if ($http_referer ~* "/superset/|/admin/superset-graph-builder") {
            set $should_redirect_admin 0;
        }
        if ($should_redirect_admin = 1) {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        proxy_pass http://superset:8088/superset/welcome/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    location ^~ /superset/ {
        auth_request /_auth/superset-admin;
        set $should_redirect_admin 0;
        if ($http_sec_fetch_dest = "document") {
            set $should_redirect_admin 1;
        }
        if ($http_referer ~* "/superset/|/admin/superset-graph-builder") {
            set $should_redirect_admin 0;
        }
        if ($should_redirect_admin = 1) {
            return 302 $scheme://$http_host/admin/superset-graph-builder;
        }
        proxy_pass http://superset:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /superset;
        proxy_redirect off;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
