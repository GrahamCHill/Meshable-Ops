name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azure]
    defaults:
      run:
        working-directory: infra/${{ matrix.provider }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - name: Test networking and storage with mocked cloud providers
        run: terraform test -no-color

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode --no-transfer-progress verify
        working-directory: backend

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ml-backend/requirements.txt
            weasy-renderer/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation
      - run: python -m venv /tmp/weaveops-renderer && /tmp/weaveops-renderer/bin/pip install -r weasy-renderer/requirements-dev.txt
      - run: /tmp/weaveops-renderer/bin/python -m unittest discover -s tests -v
        working-directory: weasy-renderer
      - run: python -m venv /tmp/weaveops-extraction && /tmp/weaveops-extraction/bin/pip install -r ml-backend/requirements.txt
      - run: /tmp/weaveops-extraction/bin/python -m unittest discover -s tests -v
        working-directory: ml-backend
      - run: python -m unittest discover -s deploy/github/tests -v
      - run: python deploy/github/check-release-version.py

  deployment-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: bash -n deploy/github/deploy.sh deploy/github/send-release.sh superset/docker-init.sh
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: python3 deploy/github/check-config.py
